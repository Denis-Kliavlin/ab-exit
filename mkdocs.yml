site_name: AB-EXIT
site_url: https://docs.ab-exit.com/
site_description: "AB-EXIT: перед выборами каждый выбирает — голосовать или взять выплату и не голосовать. Выплата — процент от медианного дохода, утверждённый референдумом; один бюллетень — один голос; вводит только референдум."
repo_url: https://github.com/Denis-Kliavlin/ab-exit
repo_name: Denis-Kliavlin/ab-exit
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: ru
  features:
    # КНИЖНЫЙ РЕЖИМ:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: "Светлая тема"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Тёмная тема"
  font:
    text: PT Sans
    code: JetBrains Mono
  icon:
    logo: material/book-open-variant

extra_css:
  - assets/stylesheets/ab-exit-theme.css

plugins:
  - search:
      lang:
        - ru
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
